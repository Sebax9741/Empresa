name: Publicar web (Firebase Hosting)

on:
  push:
    branches: [ main, master, 'claude/**' ]
    paths-ignore: [ '**.md', 'android-keys/**' ]
  workflow_dispatch:

jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar carpeta web
        run: |
          mkdir -p www
          cp -r index.html css js icons manifest.webmanifest sw.js www/

      - name: Verificar que existe el secreto de Firebase
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT. Sigue los pasos del README (sección iPhone) para agregarlo."
            exit 1
          fi

      - name: Publicar en Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: empresa-ab
          channelId: live

      # Las reglas dicen quién puede leer y escribir cada cosa. Si no se
      # publican, la base de datos se queda con las viejas y rechaza cualquier
      # colección nueva, aunque la app ya sepa usarla.
      # La cuenta de servicio que creó Firebase para publicar la web puede no
      # tener permiso para tocar las reglas. Si falla, la web igual queda
      # publicada y aquí abajo se explica cómo pegarlas a mano.
      - name: Publicar las reglas de la base de datos
        id: reglas
        continue-on-error: true
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/cuenta.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/cuenta.json"
          npx --yes firebase-tools@13 deploy --only firestore:rules --project empresa-ab --non-interactive
          rm -f "$RUNNER_TEMP/cuenta.json"

      - name: Avisar si las reglas no se pudieron publicar
        if: steps.reglas.outcome == 'failure'
        run: |
          echo "::warning::No se pudieron publicar las reglas de la base de datos."
          echo "Publícalas a mano: consola de Firebase → Firestore Database → pestaña Reglas →"
          echo "pega el contenido de firestore.rules y pulsa Publicar."
          echo "Sin esto, Productos, Kardex y Notas de venta dan 'No se pudo guardar'."
