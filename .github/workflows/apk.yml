name: Compilar APK de Android

# MANUAL a propósito: compilar el APK consume muchos minutos de GitHub Actions
# (varios por compilación) y en un repositorio privado esos minutos son limitados.
# La web se sigue publicando sola en cada cambio; el APK se genera cuando hace
# falta instalarlo o actualizarlo en los celulares y tablets.
#
# Cómo generarlo: GitHub → pestaña "Actions" → "Compilar APK de Android"
#                 → botón "Run workflow" → elegir la rama → "Run workflow".
# Al terminar, el archivo queda en Releases (etiqueta "apk").
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Copiar archivos web
        run: |
          mkdir -p www
          cp -r index.html css js icons manifest.webmanifest sw.js www/

      - name: Instalar Capacitor
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar plugins (notificaciones, etc.)
        run: npx cap sync android

      - name: Generar íconos de la app
        run: |
          mkdir -p assets
          cp icons/icon-1024.png assets/icon-only.png
          cp icons/icon-1024.png assets/icon-foreground.png
          cp icons/icon-fondo-1024.png assets/icon-background.png
          cp icons/icon-1024.png assets/splash.png
          cp icons/icon-1024.png assets/splash-dark.png
          npx capacitor-assets generate --android || echo "Se usará el ícono por defecto"

      - name: Compilar APK
        run: cd android && ./gradlew assembleRelease

      # La clave de firma NO vive en el repositorio: se guarda en los secretos
      # de GitHub (Settings → Secrets and variables → Actions).
      - name: Preparar la clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64. Mira el README (sección 'Clave de firma del APK')."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Firmar APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk apk-alineada.apk
          "$BT/apksigner" sign --ks release.keystore \
            --ks-pass env:KS_PASS --ks-key-alias creditos --key-pass env:KS_PASS \
            --out control-creditos.apk apk-alineada.apk

      - name: Borrar la clave del disco
        if: always()
        run: rm -f release.keystore

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: "📱 Control de Créditos — APK para Android"
          body: |
            **Cómo instalar en tu celular o tablet:**
            1. Desde el dispositivo, descarga `control-creditos.apk` (aquí abajo, en *Assets*).
            2. Ábrelo. Si Android pregunta, permite "instalar apps de origen desconocido".
            3. ¡Listo! La app aparece como "Control de Créditos".

            Este archivo se genera a pedido. Para actualizarlo con los últimos
            cambios: GitHub → *Actions* → *Compilar APK de Android* → *Run workflow*.
          files: control-creditos.apk
